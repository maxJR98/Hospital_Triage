{% extends "base.html" %}
{% block title %}Error 404{% endblock %}
{% block page_title %}Página No Encontrada{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="error-icon mb-4"><i class="bi bi-question-circle" style="font-size:4rem;color:var(--warning)"></i></div>
    <h2>404 - Página No Encontrada</h2>
    <p class="text-muted">La página solicitada no existe o fue movida.</p>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary mt-3"><i class="bi bi-arrow-left me-2"></i>Volver al Panel</a>
</div>
{% endblock %}

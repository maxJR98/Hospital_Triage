{% extends "base.html" %}
{% block title %}Error 403{% endblock %}
{% block page_title %}Acceso Denegado{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="error-icon mb-4"><i class="bi bi-shield-exclamation" style="font-size:4rem;color:var(--danger)"></i></div>
    <h2>403 - Acceso Denegado</h2>
    <p class="text-muted">No tiene permisos para acceder a esta sección del sistema.</p>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary mt-3"><i class="bi bi-arrow-left me-2"></i>Volver al Panel</a>
</div>
{% endblock %}

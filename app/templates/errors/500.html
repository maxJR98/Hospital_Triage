{% extends "base.html" %}
{% block title %}Error 500{% endblock %}
{% block page_title %}Error del Servidor{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="error-icon mb-4"><i class="bi bi-exclamation-triangle" style="font-size:4rem;color:var(--danger)"></i></div>
    <h2>500 - Error Interno</h2>
    <p class="text-muted">Ocurrió un error inesperado. Por favor, intente nuevamente o contacte al administrador.</p>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary mt-3"><i class="bi bi-arrow-left me-2"></i>Volver al Panel</a>
</div>
{% endblock %}

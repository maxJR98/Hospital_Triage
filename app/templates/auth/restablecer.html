{% extends "base.html" %}
{% block title %}Restablecer Contraseña{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="bi bi-shield-lock-fill"></i></div>
            <h2 class="auth-title">Nueva Contraseña</h2>
            <p class="auth-subtitle">Ingrese su nueva contraseña (mínimo 8 caracteres)</p>
        </div>
        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" required minlength="8" placeholder="Nueva contraseña">
                <label for="password"><i class="bi bi-lock me-2"></i>Nueva Contraseña</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Confirmar contraseña">
                <label for="confirm_password"><i class="bi bi-lock-fill me-2"></i>Confirmar Contraseña</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 auth-btn">
                <i class="bi bi-check-lg me-2"></i>Restablecer Contraseña
            </button>
        </form>
    </div>
    <div class="auth-bg-decoration">
        <div class="auth-bg-circle auth-bg-circle-1"></div>
        <div class="auth-bg-circle auth-bg-circle-2"></div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Nueva Regla Clínica{% endblock %}
{% block page_title %}<i class="bi bi-plus-lg me-2"></i>Nueva Regla Clínica{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Parámetro Clínico *</label>
                            <select class="form-select" name="parametro" required>
                                <option value="">Seleccionar...</option>
                                <option value="frecuencia_cardiaca">Frecuencia Cardíaca</option>
                                <option value="frecuencia_respiratoria">Frecuencia Respiratoria</option>
                                <option value="temperatura">Temperatura</option>
                                <option value="saturacion_oxigeno">Saturación de Oxígeno</option>
                                <option value="presion_sistolica">Presión Sistólica</option>
                                <option value="presion_diastolica">Presión Diastólica</option>
                                <option value="nivel_dolor">Nivel de Dolor</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Operador *</label>
                            <select class="form-select" name="operador" required>
                                <option value=">">&gt; (mayor que)</option>
                                <option value="<">&lt; (menor que)</option>
                                <option value=">=">&gt;= (mayor o igual)</option>
                                <option value="<=">&lt;= (menor o igual)</option>
                                <option value="=">=  (igual)</option>
                                <option value="BETWEEN">BETWEEN (entre)</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Umbral *</label>
                            <input type="text" class="form-control" name="valor_umbral" required placeholder="Ej: 130 o 90,93">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Prioridad *</label>
                            <select class="form-select" name="nivel_prioridad" required>
                                <option value="P1">P1 - Resucitación</option>
                                <option value="P2">P2 - Emergencia</option>
                                <option value="P3">P3 - Urgente</option>
                                <option value="P4">P4 - Semi-urgente</option>
                                <option value="P5">P5 - No urgente</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Descripción</label>
                            <input type="text" class="form-control" name="descripcion" placeholder="Ej: Taquicardia severa" maxlength="255">
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="activo" id="activo" checked>
                                <label class="form-check-label" for="activo">Regla activa</label>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('admin.listar_reglas') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-2"></i>Crear Regla</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
